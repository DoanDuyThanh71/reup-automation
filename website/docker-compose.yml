services:
  portal:
    build: .
    container_name: reup_studio_portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORTAL_PORT=8088
      - PAYMENT_PREFIX=${PAYMENT_PREFIX:-RS}
    volumes:
      - ./data:/srv/portal/data
      - ./downloads:/srv/dist
    expose:
      - "8088"

  caddy:
    image: caddy:2-alpine
    container_name: reup_studio_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal

volumes:
  caddy_data:
  caddy_config:
